syntax = "proto3";

package trade;

import "common.proto";
import "contract.proto";
import "identity.proto";
import "account.proto";
import "network_identity.proto";
import "offer.proto";
import "rpc.proto";
import "support.proto";
import "user.proto";

option java_package = "bisq.trade.protobuf";
option java_multiple_files = true;

message TradeParty {
  network.identity.NetworkId networkId = 1;
  optional contract.ContractSignatureData contractSignatureData = 2;
  oneof message {
    BisqEasyTradeParty bisqEasyTradeParty = 20;
    MuSigTradeParty muSigTradeParty = 21;
  }
}

enum TradeRole {
  TRADEROLE_UNSPECIFIED = 0;
  TRADEROLE_BUYER_AS_TAKER = 1;
  TRADEROLE_BUYER_AS_MAKER = 2;
  TRADEROLE_SELLER_AS_TAKER = 3;
  TRADEROLE_SELLER_AS_MAKER = 4;
}

enum TradeLifecycleState {
  TRADELIFECYCLESTATE_UNSPECIFIED = 0;
  TRADELIFECYCLESTATE_ACTIVE = 1;
  TRADELIFECYCLESTATE_HISTORICAL = 2;
  TRADELIFECYCLESTATE_FAILED = 3;
}

enum TradeProtocolFailure {
  TRADEPROTOCOLFAILURE_UNSPECIFIED = 0;
  TRADEPROTOCOLFAILURE_UNKNOWN = 1;
  TRADEPROTOCOLFAILURE_PRICE_DEVIATION = 2;
  TRADEPROTOCOLFAILURE_NO_MATCHING_OFFER_FOUND = 3;
  TRADEPROTOCOLFAILURE_MEDIATORS_NOT_MATCHING = 4;
  TRADEPROTOCOLFAILURE_OFFER_NOT_AVAILABLE = 5;
  TRADEPROTOCOLFAILURE_CHANNEL_DATA_MISMATCH = 6;
  TRADEPROTOCOLFAILURE_SELLER_REPUTATION_TOO_LOW = 7;
}

message Trade {
  string state = 1;
  string id = 2;
  TradeRole tradeRole = 3;
  identity.Identity myIdentity = 4;
  contract.Contract contract = 5;
  TradeParty taker = 6;
  TradeParty maker = 7;
  optional string errorMessage = 8;
  optional string errorStackTrace = 9;
  optional string peersErrorMessage = 10;
  optional string peersErrorStackTrace = 11;
  TradeLifecycleState lifecycleState = 12;
  optional TradeProtocolFailure tradeProtocolFailure = 13;
  optional TradeProtocolFailure peersTradeProtocolFailure = 14;

  oneof message {
    BisqEasyTrade bisqEasyTrade = 30;
    MuSigTrade muSigTrade = 31;
  }

  // Nodes of earlier versions read these field numbers, so they must not get another type or meaning:
  // 32 was "SubmarineTrade submarineTrade", a case of the oneof message, up to version 2.1.7.
  reserved 32;
  reserved "submarineTrade";

  // The trade messages which wait in the event queue of the state machine of the trade
  repeated TradeMessage queuedTradeMessages = 33;
}
message TradeMessage {
  string id = 1;
  string tradeId = 2;
  string protocolVersion = 3;
  network.identity.NetworkId sender = 4;
  network.identity.NetworkId receiver = 5;
  oneof message {
    BisqEasyTradeMessage bisqEasyTradeMessage = 20;
    MuSigTradeMessage muSigTradeMessage = 21;
  }
}
message BisqEasyClosedTrade {
  Trade trade = 1;
  user.UserProfile myUserProfile = 2;
  user.UserProfile peerUserProfile = 3;
}

// BisqEasy
message BisqEasyTradeParty {
}

message BisqEasyTrade {
  optional string paymentAccountData = 1;
  optional string bitcoinPaymentData = 2;
  optional string paymentProof = 3;
  optional contract.Role interruptTradeInitiator = 4;
  optional sint64 tradeCompletedDate = 5;
}

message BisqEasyTradeStore {
  repeated Trade trades = 1;
  repeated string tradeIds = 2;
  repeated BisqEasyClosedTrade bisqEasyClosedTrades = 3;
}

// BisqEasy messages
message BisqEasyTradeMessage {
  oneof message {
    BisqEasyTakeOfferRequest bisqEasyTakeOfferRequest = 20;
    BisqEasyTakeOfferResponse bisqEasyTakeOfferResponse = 21;
    BisqEasyAccountDataMessage bisqEasyAccountDataMessage = 22;
    BisqEasyConfirmFiatSentMessage bisqEasyConfirmFiatSentMessage = 23;
    BisqEasyBtcAddressMessage bisqEasyBtcAddressMessage = 24;
    BisqEasyConfirmFiatReceiptMessage bisqEasyConfirmFiatReceiptMessage = 25;
    BisqEasyConfirmBtcSentMessage bisqEasyConfirmBtcSentMessage = 26;
    BisqEasyRejectTradeMessage bisqEasyRejectTradeMessage = 27;
    BisqEasyCancelTradeMessage bisqEasyCancelTradeMessage = 28;
    BisqEasyReportErrorMessage bisqEasyReportErrorMessage = 29;
  }
}
message BisqEasyTakeOfferRequest {
  contract.Contract bisqEasyContract = 1;
  contract.ContractSignatureData contractSignatureData = 2;
}
message BisqEasyTakeOfferResponse {
  contract.ContractSignatureData contractSignatureData = 1;
}
message BisqEasyAccountDataMessage {
  string paymentAccountData = 1;
  offer.Offer bisqEasyOffer = 2;
}
message BisqEasyConfirmFiatSentMessage {
}
message BisqEasyBtcAddressMessage {
  string bitcoinPaymentData = 1;
  offer.Offer bisqEasyOffer = 2;
}
message BisqEasyConfirmFiatReceiptMessage {
}
message BisqEasyConfirmBtcSentMessage {
  optional string paymentProof = 1;
}
message BisqEasyRejectTradeMessage {
}
message BisqEasyCancelTradeMessage {
}
message BisqEasyReportErrorMessage {
  string errorMessage = 1;
  string stackTrace = 2;
  TradeProtocolFailure tradeProtocolFailure = 3;
}


// MuSig

// Value objects for network messages (based on grpc messages)
message PubKeyShares {
  bytes buyerOutputPubKeyShare = 1;
  bytes sellerOutputPubKeyShare = 2;
  bytes multisigScriptKey = 3;
}

message NonceShares {
  string warningTxFeeBumpAddress = 1;
  string redirectTxFeeBumpAddress = 2;
  string claimTxPayoutAddress = 11;
  bytes halfDepositPsbt = 3;
  bytes swapTxInputNonceShare = 4;
  bytes buyersWarningTxBuyerInputNonceShare = 5;
  bytes buyersWarningTxSellerInputNonceShare = 6;
  bytes sellersWarningTxBuyerInputNonceShare = 7;
  bytes sellersWarningTxSellerInputNonceShare = 8;
  bytes buyersRedirectTxInputNonceShare = 9;
  bytes sellersRedirectTxInputNonceShare = 10;
  bytes buyersClaimTxInputNonceShare = 12;
  bytes sellersClaimTxInputNonceShare = 13;
}

message PartialSignatures {
  bytes peersWarningTxBuyerInputPartialSignature = 1;
  bytes peersWarningTxSellerInputPartialSignature = 2;
  bytes peersRedirectTxInputPartialSignature = 3;
  bytes peersClaimTxInputPartialSignature = 6;
  optional bytes swapTxInputPartialSignature = 4;
  optional bytes swapTxInputSighash = 5;
}

message SwapTxSignature {
  bytes swapTx = 1;
  bytes peerOutputPrvKeyShare = 2;
}

message PeerCustomPayoutPsbt {
  string txId = 1;
  bytes psbt = 2;
}

message MuSigCustomPayoutPartyData {
  optional musigrpc.CustomPayoutPsbt myCustomPayoutPsbt = 1;
  optional PeerCustomPayoutPsbt peersCustomPayoutPsbt = 2;
  optional musigrpc.CustomCloseTradeResponse myCustomCloseTradeResponse = 3;
}

// Trade domain
message MuSigTradeParty {
  optional musigrpc.PubKeySharesResponse myPubKeySharesResponse = 1;
  optional PubKeyShares peersPubKeyShares = 2;
  optional musigrpc.NonceSharesMessage myNonceSharesMessage = 3;
  optional NonceShares peersNonceShares = 4;
  optional musigrpc.PartialSignaturesMessage myPartialSignaturesMessage = 5;
  optional PartialSignatures peersPartialSignatures = 6;
  optional musigrpc.DepositPsbt myDepositPsbt = 7;
  optional common.ByteArray depositTx = 8;
  optional musigrpc.SwapTxSignatureResponse mySwapTxSignatureResponse = 9;
  optional SwapTxSignature peersSwapTxSignature = 10;
  optional musigrpc.CloseTradeResponse myCloseTradeResponse = 11;
  optional common.ByteArray peersOutputPrvKeyShare = 12;
  optional account.AccountPayload accountPayload = 13;
  optional MuSigCustomPayoutPartyData customPayoutData = 14;
  bool mediationResultRejected = 15;
}

enum MuSigDisputeState {
  MUSIGDISPUTESTATE_UNSPECIFIED = 0;
  MUSIGDISPUTESTATE_NO_DISPUTE = 1;
  MUSIGDISPUTESTATE_MEDIATION_REQUESTED = 2;
  MUSIGDISPUTESTATE_MEDIATION_OPEN = 3;
  MUSIGDISPUTESTATE_MEDIATION_CLOSED = 4;
  MUSIGDISPUTESTATE_MEDIATION_RE_OPENED = 5;
  MUSIGDISPUTESTATE_ARBITRATION_REQUESTED = 6;
  MUSIGDISPUTESTATE_ARBITRATION_OPEN = 7;
  MUSIGDISPUTESTATE_ARBITRATION_CLOSED = 8;
}

message MuSigTradeDispute {
  MuSigDisputeState disputeState = 1;
  optional support.MuSigMediationResult muSigMediationResult = 2;
  optional bytes mediationResultSignature = 3;
  optional support.MuSigArbitrationResult muSigArbitrationResult = 4;
  optional bytes arbitrationResultSignature = 5;
}

message MuSigTrade {
  optional string depositTxId = 1;
  optional sint64 tradeCompletedDate = 2;
  MuSigTradeDispute tradeDispute = 3;
}

message MuSigTradeStore {
  map<string, Trade> tradeById = 1;
}

// MuSig network messages
message MuSigTradeMessage {
  oneof message {
    SetupTradeMessage_A setupTradeMessage_A = 20;
    SetupTradeMessage_B setupTradeMessage_B = 21;
    SetupTradeMessage_C setupTradeMessage_C = 22;
    SetupTradeMessage_D setupTradeMessage_D = 23;
    SendAccountPayloadAndDepositTxMessage sendAccountPayloadAndDepositTxMessage = 24;
    SendAccountPayloadMessage sendAccountPayloadMessage = 25;
    PaymentInitiatedMessage_E paymentInitiatedMessage_E = 26;
    PaymentReceivedMessage_F paymentReceivedMessage_F = 27;
    CooperativeClosureMessage_G cooperativeClosureMessage_G = 28;
    MuSigReportErrorMessage muSigReportErrorMessage = 29;
    MuSigCustomPayoutPsbtMessage muSigCustomPayoutPsbtMessage = 30;
    MuSigMediationResultRejectionMessage muSigMediationResultRejectionMessage = 31;
  }
}

message MuSigReportErrorMessage {
  string errorMessage = 1;
  string stackTrace = 2;
  TradeProtocolFailure tradeProtocolFailure = 3;
}

message SetupTradeMessage_A {
  contract.Contract contract = 1;
  contract.ContractSignatureData contractSignatureData = 2;
  PubKeyShares pubKeyShares = 3;
}

message SetupTradeMessage_B {
  contract.Contract contract = 1;
  contract.ContractSignatureData contractSignatureData = 2;
  PubKeyShares pubKeyShares = 3;
  NonceShares nonceShares = 4;
}

message SetupTradeMessage_C {
  NonceShares nonceShares = 1;
  PartialSignatures partialSignatures = 2;
}

message SetupTradeMessage_D {
  PartialSignatures partialSignatures = 1;
  bytes depositPsbt = 2;
}

message SendAccountPayloadAndDepositTxMessage {
  common.ByteArray depositTx = 1;
  account.AccountPayload accountPayload = 2;
}

message SendAccountPayloadMessage {
  account.AccountPayload accountPayload = 1;
}

message PaymentInitiatedMessage_E {
  bytes swapTxInputPartialSignature = 1;
}

message PaymentReceivedMessage_F {
  SwapTxSignature swapTxSignature = 1;
}

message CooperativeClosureMessage_G {
  common.ByteArray peerOutputPrvKeyShare = 1;
}

message MuSigCustomPayoutPsbtMessage {
  bytes mediationResultHash = 1;
  string txId = 2;
  bytes psbt = 3;
}

message MuSigMediationResultRejectionMessage {
  bytes mediationResultHash = 1;
}

// MuSig V2 local persistence. Separate from the V1 store and wire protocol.
// Shared event identities and failure details

enum MuSigV2EventType {
  TYPE_UNSPECIFIED = 0;
  TAKE_OFFER = 1;
  SETUP_A = 2;
  SETUP_B = 3;
  SETUP_C = 4;
  SETUP_D = 5;
  ACCOUNT_PAYLOAD_AND_DEPOSIT = 6;
  ACCOUNT_PAYLOAD = 7;
  PAYMENT_INITIATED = 8;
  PAYMENT_RECEIVED = 9;
  COOPERATIVE_CLOSURE = 10;
  DEPOSIT_CONFIRMED = 11;
  PAYMENT_RECEIPT_CONFIRMED = 12;
  CLOSE_TIMEOUT = 13;
  MEDIATION_REQUESTED = 14;
  MEDIATION_OPENED = 15;
  MEDIATION_CLOSED = 16;
  MEDIATION_RESULT_ACCEPTED = 17;
  MEDIATION_RESULT_REJECTED = 18;
  MEDIATION_RESULT_BY_MYSELF_ACCEPTED = 19;
  MEDIATION_RESULT_BY_PEER_ACCEPTED = 20;
  PEER_CUSTOM_PAYOUT = 21;
  PEER_RESULT_REJECTION = 22;
  PAYMENT_INITIATED_EVENT = 23;
  PROCESSING_FAILED = 24;
  REPORT_ERROR = 25;
  TRADE_ARCHIVED = 26;
  EXECUTION_FAILED = 27;
  MEDIATION_PAYMENT_DETAILS_REQUESTED = 28;
  BUYER_CLOSE_TIMEOUT = 29;
  DEPOSIT_CONFIRMATION_SKIPPED = 30;
}

message MuSigV2FailureDetails {
  TradeProtocolFailure tradeProtocolFailure = 1;
  string errorMessage = 2;
  string errorStackTrace = 3;
}

// MuSig V2 execution

message MuSigTradeExecutionState {
  message Failed {
  }
  message FailedAtPeer {
  }
  message Init {
  }
  message TradeInitializedAndNonceSharesCreated {
  }
  message PartialSignaturesCreatedAndDepositTxSigned {
  }
  message TradeInitialized {
  }
  message NonceSharesAndPartialSignaturesCreated {
  }
  message DepositTxSignedAndPublished {
  }
  message AccountPayloadReceived {
  }
  message DepositTxConfirmed {
  }
  message PaymentInitiatedMessageReceived {
  }
  message PaymentReceiptConfirmed {
  }
  message CustomPayoutSigned {
  }
  message CustomPayoutClosedTrade {
  }
  message SellerForceClosedTrade {
  }
  message TradeClosed {
  }
  message PaymentInitiated {
  }
  oneof message {
    Init init = 1;
    TradeInitialized tradeInitialized = 2;
    NonceSharesAndPartialSignaturesCreated nonceSharesAndPartialSignaturesCreated = 3;
    DepositTxSignedAndPublished depositTxSignedAndPublished = 4;
    AccountPayloadReceived accountPayloadReceived = 5;
    DepositTxConfirmed depositTxConfirmed = 6;
    PaymentInitiatedMessageReceived paymentInitiatedMessageReceived = 7;
    PaymentReceiptConfirmed paymentReceiptConfirmed = 8;
    CustomPayoutSigned customPayoutSigned = 9;
    CustomPayoutClosedTrade customPayoutClosedTrade = 10;
    SellerForceClosedTrade sellerForceClosedTrade = 11;
    TradeClosed tradeClosed = 12;
    PaymentInitiated paymentInitiated = 13;
    TradeInitializedAndNonceSharesCreated tradeInitializedAndNonceSharesCreated = 14;
    PartialSignaturesCreatedAndDepositTxSigned partialSignaturesCreatedAndDepositTxSigned = 15;
    Failed failed = 16;
    FailedAtPeer failedAtPeer = 17;
  }
}

message MuSigV2TradeExecution {
  MuSigTradeExecutionState state = 1;
  MuSigV2TradeExecutionData data = 2;
}

message MuSigV2TradeExecutionData {
  optional PubKeyShares myPubKeyShares = 1;
  optional contract.ContractSignatureData myContractSignature = 2;
  optional contract.ContractSignatureData peerContractSignature = 3;
  optional PubKeyShares peerPubKeyShares = 4;
  optional NonceShares peerNonceShares = 5;
  optional musigrpc.NonceSharesMessage myNonceShares = 6;
  optional musigrpc.PartialSignaturesMessage myPartialSignatures = 7;
  optional PartialSignatures peerRedactedPartialSignatures = 8;
  optional PartialSignatures peerPartialSignatures = 9;
  optional musigrpc.DepositPsbt myDepositPsbt = 10;
  optional musigrpc.DepositPsbt peerDepositPsbt = 11;
  optional account.AccountPayload peerAccountPayload = 12;
  optional musigrpc.SwapTxSignatureResponse mySwapTxSignatureResponse = 13;
  optional common.ByteArray peersOutputPrvKeyShare = 14;
  optional musigrpc.CloseTradeResponse myCloseTradeResponse = 15;
  optional musigrpc.CustomPayoutPsbt myCustomPayoutPsbt = 16;
  optional PeerCustomPayoutPsbt peerCustomPayoutPsbt = 17;
  optional musigrpc.CustomCloseTradeResponse customCloseTradeResponse = 18;
  optional SwapTxSignature peerSwapTxSignature = 19;
  optional common.ByteArray peerDepositTx = 20;
  optional MuSigV2FailureDetails myFailure = 21;
  optional MuSigV2FailureDetails peerFailure = 22;
}

// MuSig V2 mediation

message MuSigMediationDecisionState {
  message Init {
  }
  message Accepted {
  }
  message Rejected {
  }
  message Failed {
  }
  oneof message {
    Init init = 1;
    Accepted accepted = 2;
    Rejected rejected = 3;
    Failed failed = 4;
  }
}

message MuSigV2MediationDecision {
  MuSigMediationDecisionState state = 1;
  MuSigV2MediationDecisionData data = 2;
}

message MuSigV2MediationDecisionData {
  optional MuSigV2FailureDetails failure = 1;
}

message MuSigMediationState {
  message Init {
  }
  message Requested {
  }
  message Open {
  }
  message Closed {
  }
  message Failed {
  }
  oneof message {
    Init init = 1;
    Requested requested = 2;
    Open open = 3;
    Closed closed = 4;
    Failed failed = 5;
  }
}

message MuSigV2Mediation {
  MuSigMediationState state = 1;
  MuSigV2MediationData data = 2;
  MuSigV2MediationDecision myDecision = 3;
  MuSigV2MediationDecision peerDecision = 4;
}

message MuSigV2MediationData {
  optional support.MuSigMediationResult result = 1;
  optional bytes signature = 2;
  optional MuSigV2FailureDetails failure = 3;
}

// MuSig V2 trade

message MuSigTradeState {
  message Active {
  }
  message Failed {
  }
  message Historical {
  }
  oneof message {
    Active active = 1;
    Failed failed = 2;
    Historical historical = 3;
  }
}

message MuSigV2Trade {
  string id = 1;
  MuSigTradeState state = 2;
  MuSigV2TradeData data = 3;
  MuSigV2TradeExecution execution = 4;
  optional MuSigV2Mediation mediation = 5;
}

message MuSigV2TradeData {
  contract.Contract contract = 1;
  identity.Identity myIdentity = 2;
  TradeRole myRole = 3;
  string protocolVersion = 4;
  account.AccountPayload myAccountPayload = 5;
}

// MuSig V2 events

message MuSigTakeOfferEvent {
}

message DepositTxConfirmedEvent {
}

message DepositConfirmationSkippedEvent {
}

message PaymentInitiatedEvent {
}

message PaymentReceiptConfirmedEvent {
}

message SellersCloseTradeTimeoutEvent {
}

message BuyersCloseTradeTimeoutEvent {
}

message MediationResultAcceptedEvent {
}

message MediationResultRejectedEvent {
}

message MediationRequestedEvent {
}

message MediationOpenedEvent {
  support.MuSigMediationStateChangeMessage message = 1;
}

message MediationClosedEvent {
  support.MuSigMediationStateChangeMessage message = 1;
}

message MediationPaymentDetailsRequestedEvent {
  support.MuSigDisputeCasePaymentDetailsRequest message = 1;
}

message MediationResultByMyselfAcceptedEvent {
  support.MuSigMediationResult result = 1;
}

message MediationResultByPeerAcceptedEvent {
  PeerCustomPayoutPsbt psbt = 1;
}

message MuSigProcessingFailedEvent {
  TradeProtocolFailure tradeProtocolFailure = 1;
  string errorMessage = 2;
  string stackTrace = 3;
}

message TradeArchivedEvent {
}

message ExecutionFailedEvent {
}

message TradeEvent {
  oneof event {
    MuSigTradeEvent muSigTradeEvent = 1;
  }
}

message MuSigTradeEvent {
  oneof event {
    MuSigTakeOfferEvent takeOffer = 1;
    DepositTxConfirmedEvent depositTxConfirmed = 2;
    PaymentInitiatedEvent paymentInitiated = 3;
    PaymentReceiptConfirmedEvent paymentReceiptConfirmed = 4;
    SellersCloseTradeTimeoutEvent sellersCloseTradeTimeout = 5;
    MediationResultAcceptedEvent mediationResultAccepted = 6;
    MediationResultRejectedEvent mediationResultRejected = 7;
    MediationRequestedEvent mediationRequested = 8;
    MediationOpenedEvent mediationOpened = 9;
    MediationClosedEvent mediationClosed = 10;
    MediationResultByMyselfAcceptedEvent mediationResultByMyselfAccepted = 11;
    MediationResultByPeerAcceptedEvent mediationResultByPeerAccepted = 12;
    MuSigProcessingFailedEvent processingFailed = 13;
    TradeArchivedEvent tradeArchived = 14;
    ExecutionFailedEvent executionFailed = 15;
    MediationPaymentDetailsRequestedEvent mediationPaymentDetailsRequested = 16;
    BuyersCloseTradeTimeoutEvent buyersCloseTradeTimeout = 17;
    DepositConfirmationSkippedEvent depositConfirmationSkipped = 18;
  }
}

// MuSig V2 domain effects

message ActivateMediationChat {
}

message ObserveDepositTxConfirmation {
}

message RemoveTakenOffer {
}

// MuSig V2 store

message MuSigV2TradeRecord {
  // Protobuf maps cannot contain repeated values directly.
  message ProcessedEventTypes {
    repeated MuSigV2EventType types = 1;
  }

  MuSigV2Trade trade = 1;
  repeated common.Delivery pendingInputs = 2;
  repeated common.ScheduledEvent scheduledEvents = 3;
  repeated common.Effect pendingEffects = 4;
  map<string, ProcessedEventTypes> processedEventTypes = 5;
}

message MuSigV2TradeStore {
  map<string, MuSigV2TradeRecord> tradeById = 1;
}
